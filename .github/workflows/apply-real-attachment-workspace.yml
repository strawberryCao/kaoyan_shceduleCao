name: Apply real attachment workspace

on:
  workflow_dispatch:
  push:
    branches: [fix/learning-record-multimaterial-continuation]
    paths:
      - 'scripts/apply-real-attachment-workspace-route.cjs'
      - '.github/workflows/apply-real-attachment-workspace.yml'
  pull_request:
    branches: [fix/learning-detail-title-latex]
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/apply-real-attachment-workspace-route.cjs'
      - '.github/workflows/apply-real-attachment-workspace.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: real-attachment-workspace-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/learning-record-multimaterial-continuation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json

      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci --ignore-scripts

      - name: Connect real attachment workspace
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          node scripts/apply-real-attachment-workspace-route.cjs > "$RUNNER_TEMP/workspace-transform.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/workspace-transform.log"
          if (( status != 0 )) && [[ -n "${PR_NUMBER:-}" ]]; then
            {
              echo '## 真实资料工作区接线失败'
              echo
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/workspace-transform.log"
              echo '```'
            } > "$RUNNER_TEMP/workspace-transform-comment.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/workspace-transform-comment.md"
          fi
          exit "$status"

      - name: Normalize and validate changed source
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [
              Path('outputs/kaoyan-schedule-app/src/components/LearningRecordWorkspacePreview.tsx'),
              Path('outputs/kaoyan-schedule-app/src/components/LearningCenter.tsx'),
              Path('outputs/kaoyan-schedule-app/src/App.tsx'),
              Path('outputs/kaoyan-schedule-app/src/learning-record-workspace-preview.css'),
          ]:
              text = path.read_text(encoding='utf-8')
              path.write_text('\n'.join(line.rstrip(' \t') for line in text.split('\n')), encoding='utf-8')
          PY
          node --check scripts/apply-real-attachment-workspace-route.cjs
          git diff --check

      - name: Run targeted learning and material tests
        working-directory: outputs/kaoyan-schedule-app
        run: |
          node --test scripts/learning-multimaterial.test.cjs scripts/note-file-material.test.cjs
          node --test scripts/__tests__/material-note-flow.test.cjs scripts/__tests__/note-save-flow.test.cjs
          node --test cloudflare/media-material.test.mjs cloudflare/learning-multimaterial.test.mjs

      - name: Run full automated suite
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        env:
          CAOBIJI_GITHUB_TOKEN: ''
        run: |
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          (( ${#test_files[@]} > 0 ))
          node --test --test-concurrency=1 "${test_files[@]}"

      - name: Build application
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build

      - name: Commit verified workspace integration
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            outputs/kaoyan-schedule-app/src/components/LearningRecordWorkspacePreview.tsx \
            outputs/kaoyan-schedule-app/src/components/LearningCenter.tsx
          if git diff --cached --quiet; then
            echo 'No generated workspace changes remain.'
            exit 0
          fi
          git commit -m 'feat: open real note attachments in the workspace'
          git push origin HEAD:fix/learning-record-multimaterial-continuation
