name: Verify mobile capture stability

on:
  pull_request:
    branches:
      - fix/learning-detail-title-latex
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: verify-mobile-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-capture-stability-parity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json

      - name: Apply compatibility fixes without weakening AI title safety
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('outputs/kaoyan-schedule-app')
          tests = app / 'scripts'

          fast = tests / 'cloud-capture-fast-pipeline.test.cjs'
          text = fast.read_text(encoding='utf-8')
          old = "  assert.match(block, /本机后台队列|可以立即退出/);"
          new = "  assert.match(block, /已安全保存在本机/);\n  assert.match(block, /重新打开后会自动续传/);"
          if old not in text:
              raise SystemExit('cloud-capture-fast-pipeline legacy assertion anchor missing')
          fast.write_text(text.replace(old, new, 1), encoding='utf-8')

          local_test = tests / 'mobile-local-first-analysis.test.cjs'
          text = local_test.read_text(encoding='utf-8')
          old = "  assert.match(capture, /可以立即退出/);"
          new = "  assert.match(capture, /已安全保存在本机/);\n  assert.match(capture, /重新打开后会自动续传/);"
          if old not in text:
              raise SystemExit('mobile-local-first legacy assertion anchor missing')
          local_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          policy = app / 'shared/note-title-policy.js'
          text = policy.read_text(encoding='utf-8')
          old = """  const title = sanitizeNoteTitle(value, titleMaxLength);
  if (!title) return { ok: false, title, problem: '标题为空' };
  if (title.length < Math.min(4, titleMinLength)) return { ok: false, title, problem: '标题过短' };
  const chinese = title.match(/[\\u3400-\\u9fff]/gu)?.length || 0;
  const letters = title.match(/[A-Za-z]/g)?.length || 0;
  if (REFUSAL_PATTERN.test(title)) return { ok: false, title, problem: '标题包含模型拒答或英文说明句' };
  if (chinese < 2 || (letters > 10 && letters > chinese * 1.5)) {
    return { ok: false, title, problem: '标题必须以中文为主，不能输出英文句子' };
  }
"""
          new = """  const title = sanitizeNoteTitle(value, titleMaxLength);
  const ruleValue = sanitizeNoteTitle(options.ruleValue, 80);
  const ruleMatched = options.allowRuleIdentifier === true && Boolean(ruleValue) && title.includes(ruleValue);
  if (!title) return { ok: false, title, problem: '标题为空' };
  if (title.length < (ruleMatched ? 2 : Math.min(4, titleMinLength))) return { ok: false, title, problem: '标题过短' };
  const chinese = title.match(/[\\u3400-\\u9fff]/gu)?.length || 0;
  const letters = title.match(/[A-Za-z]/g)?.length || 0;
  if (REFUSAL_PATTERN.test(title)) return { ok: false, title, problem: '标题包含模型拒答或英文说明句' };
  if (!ruleMatched && (chinese < 2 || (letters > 10 && letters > chinese * 1.5))) {
    return { ok: false, title, problem: '标题必须以中文为主，不能输出英文句子' };
  }
"""
          if old not in text:
              raise SystemExit('shared title policy validation anchor missing')
          text = text.replace(old, new, 1)
          policy.write_text(text, encoding='utf-8')

          local_server = app / 'scripts/note-server.cjs'
          text = local_server.read_text(encoding='utf-8')
          old = "    const titleValidation = validateNoteTitle(title, { ...options, titleMinLength, titleMaxLength });"
          new = "    const titleValidation = validateNoteTitle(title, { ...options, titleMinLength, titleMaxLength, allowRuleIdentifier: Boolean(matchedRule && ruleValue), ruleValue });"
          if old not in text:
              raise SystemExit('local title validation anchor missing')
          local_server.write_text(text.replace(old, new, 1), encoding='utf-8')

          cloud = app / 'cloudflare/rename-job.js'
          text = cloud.read_text(encoding='utf-8')
          old = """function titleProblem(title, settings) {
  return validateNoteTitle(title, settings.options || {}).problem;
}"""
          new = """function titleProblem(title, settings, ruleValue = '') {
  return validateNoteTitle(title, {
    ...(settings.options || {}),
    allowRuleIdentifier: Boolean(ruleValue),
    ruleValue,
  }).problem;
}"""
          if old not in text:
              raise SystemExit('cloud titleProblem anchor missing')
          text = text.replace(old, new, 1)
          old = "    problem: titleProblem(title, settings),"
          new = "    problem: titleProblem(title, settings, matchedRule && ruleValue ? ruleValue : ''),"
          if old not in text:
              raise SystemExit('cloud rule title validation call anchor missing')
          cloud.write_text(text.replace(old, new, 1), encoding='utf-8')

          behavior = tests / 'mobile-capture-contract-behavior.test.cjs'
          text = behavior.read_text(encoding='utf-8')
          old = """  assert.equal(policy.validateNoteTitle('导数定义与切线方程').ok, true);
  assert.equal(policy.createFallbackNoteTitle({ splitIndex: 3 }), '待确认题目·第3题');"""
          new = """  assert.equal(policy.validateNoteTitle('导数定义与切线方程').ok, true);
  assert.equal(policy.validateNoteTitle('250626-088', { allowRuleIdentifier: true, ruleValue: '250626-088' }).ok, true);
  assert.equal(policy.validateNoteTitle('The image does not contain 250626-088', { allowRuleIdentifier: true, ruleValue: '250626-088' }).ok, false);
  assert.equal(policy.createFallbackNoteTitle({ splitIndex: 3 }), '待确认题目·第3题');"""
          if old not in text:
              raise SystemExit('behavior rule-title assertion anchor missing')
          behavior.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove postinstall side effects from the PR
        run: |
          git fetch origin fix/learning-detail-title-latex
          git checkout origin/fix/learning-detail-title-latex -- \
            outputs/kaoyan-schedule-app/取消开机自启.cmd \
            outputs/kaoyan-schedule-app/安装依赖.cmd \
            outputs/kaoyan-schedule-app/导入敦煌壁纸图片.cmd \
            outputs/kaoyan-schedule-app/收集环境信息.cmd \
            outputs/kaoyan-schedule-app/整理笔记元数据.cmd \
            outputs/kaoyan-schedule-app/测试千问连接.cmd \
            outputs/kaoyan-schedule-app/生成敦煌动态壁纸视频.cmd \
            outputs/kaoyan-schedule-app/设置开机自启.cmd \
            outputs/kaoyan-schedule-app/配置千问命名.cmd
          if git cat-file -e origin/fix/learning-detail-title-latex:outputs/kaoyan-schedule-app/scripts/.apply-real-learning-records-v1 2>/dev/null; then
            git checkout origin/fix/learning-detail-title-latex -- outputs/kaoyan-schedule-app/scripts/.apply-real-learning-records-v1
          else
            rm -f outputs/kaoyan-schedule-app/scripts/.apply-real-learning-records-v1
          fi

      - name: Install dependencies without repository mutation hooks
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci --ignore-scripts

      - name: Run focused mobile behavior suite
        working-directory: outputs/kaoyan-schedule-app
        run: >-
          node --test
          scripts/mobile-capture-contract-behavior.test.cjs
          scripts/mobile-local-first-analysis.test.cjs
          scripts/cloud-capture-fast-pipeline.test.cjs
          scripts/public-lan-parity.test.cjs

      - name: Run complete Node regression suite
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' tests < <(find scripts cloudflare -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.test.js' \) -print0 | sort -z)
          printf 'Running %s test files\n' "${#tests[@]}"
          set +e
          node --test "${tests[@]}" 2>&1 | tee /tmp/full-regression.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### 全量 Node 回归失败（精简定位）'
              echo
              echo '```text'
              grep -nE '^(not ok|# Subtest:)|AssertionError|TestContext\.<anonymous>|operator:|ERR_' /tmp/full-regression.log | tail -n 160
              echo '```'
            } > /tmp/full-regression-comment.md
            gh pr comment 43 --repo strawberryCao/kaoyan_shceduleCao --body-file /tmp/full-regression-comment.md
            exit "$status"
          fi

      - name: Run production build
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build

      - name: Verify Cloudflare Worker bundle
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run

      - name: Commit clean verified patch
        run: |
          rm -f .github/workflows/verify-mobile-capture-stability.yml
          git checkout origin/fix/learning-detail-title-latex -- \
            outputs/kaoyan-schedule-app/取消开机自启.cmd \
            outputs/kaoyan-schedule-app/安装依赖.cmd \
            outputs/kaoyan-schedule-app/导入敦煌壁纸图片.cmd \
            outputs/kaoyan-schedule-app/收集环境信息.cmd \
            outputs/kaoyan-schedule-app/整理笔记元数据.cmd \
            outputs/kaoyan-schedule-app/测试千问连接.cmd \
            outputs/kaoyan-schedule-app/生成敦煌动态壁纸视频.cmd \
            outputs/kaoyan-schedule-app/设置开机自启.cmd \
            outputs/kaoyan-schedule-app/配置千问命名.cmd
          if git cat-file -e origin/fix/learning-detail-title-latex:outputs/kaoyan-schedule-app/scripts/.apply-real-learning-records-v1 2>/dev/null; then
            git checkout origin/fix/learning-detail-title-latex -- outputs/kaoyan-schedule-app/scripts/.apply-real-learning-records-v1
          else
            rm -f outputs/kaoyan-schedule-app/scripts/.apply-real-learning-records-v1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stabilize mobile multi-question capture and naming"
          git push origin HEAD:agent/mobile-capture-stability-parity
