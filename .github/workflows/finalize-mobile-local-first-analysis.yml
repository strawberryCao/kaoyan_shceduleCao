name: Finalize mobile local-first analysis

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    paths:
      - '.github/patches/finalize-mobile-local-first.py'
      - '.github/workflows/finalize-mobile-local-first-analysis.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/mobile-local-first-analysis-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-local-first-analysis-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json
      - name: Apply final reliability patch
        shell: bash
        run: |
          set -o pipefail
          {
            python3 -m py_compile .github/patches/finalize-mobile-local-first.py
            python3 .github/patches/finalize-mobile-local-first.py
            node --check outputs/kaoyan-schedule-app/cloudflare/background-jobs.js
            node --check outputs/kaoyan-schedule-app/cloudflare/learning.js
            node --check outputs/kaoyan-schedule-app/cloudflare/note-analysis-job.js
            node --check outputs/kaoyan-schedule-app/scripts/note-ai-analyzer.cjs
            node --check outputs/kaoyan-schedule-app/scripts/agent-workflow-contracts.cjs
          } 2>&1 | tee /tmp/finalize-local-first.log
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalize-local-first-${{ github.run_id }}
          path: /tmp/finalize-local-first.log
          if-no-files-found: warn
          retention-days: 3
      - name: Prepare clean final commit
        run: |
          set -euo pipefail
          rm -f .github/patches/finalize-mobile-local-first.py
          rm -f .github/workflows/finalize-mobile-local-first-analysis.yml
          git config user.name 'Kaoyan Local First Finalizer'
          git config user.email 'local-first-finalizer@local.invalid'
          git add -A -- \
            .github/patches/finalize-mobile-local-first.py \
            .github/workflows/finalize-mobile-local-first-analysis.yml \
            outputs/kaoyan-schedule-app/cloudflare/background-jobs.js \
            outputs/kaoyan-schedule-app/cloudflare/learning.js \
            outputs/kaoyan-schedule-app/cloudflare/note-analysis-job.js \
            outputs/kaoyan-schedule-app/scripts/note-ai-analyzer.cjs \
            outputs/kaoyan-schedule-app/scripts/mobile-local-first-analysis.test.cjs
          git commit -m 'fix: harden local-first AI pipeline recovery and parity'
      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci
      - name: Run all automated tests
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        run: |
          set -o pipefail
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          (( ${#test_files[@]} > 0 ))
          node --test "${test_files[@]}" 2>&1 | tee /tmp/finalize-local-first-tests.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalize-local-first-tests-${{ github.run_id }}
          path: /tmp/finalize-local-first-tests.log
          if-no-files-found: warn
          retention-days: 3
      - name: Build production app
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build
      - name: Validate Worker bundle
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run
      - name: Push validated final commit
        run: git push origin HEAD:fix/mobile-local-first-analysis-parity
