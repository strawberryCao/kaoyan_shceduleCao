name: Finalize durable mobile outbox

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    paths:
      - '.github/workflows/diagnose-local-first-build.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/mobile-local-first-analysis-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-local-first-analysis-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json
      - name: Fix IndexedDB promise typing and add lease regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          root = Path('outputs/kaoyan-schedule-app')
          queue = root / 'src/utils/captureUploadQueue.ts'
          source = queue.read_text(encoding='utf-8')
          before = """  databasePromise = new Promise((resolve, reject) => {
              if (!window.indexedDB) {
                reject(new Error('当前浏览器不支持本地可靠上传队列。'));
                return;
              }
              const request = window.indexedDB.open(DB_NAME, DB_VERSION);
              request.onerror = () => reject(request.error ?? new Error('本地上传队列打开失败。'));
              request.onupgradeneeded = () => {
                const database = request.result;
                if (!database.objectStoreNames.contains(STORE_NAME)) {
                  database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
              };
              request.onsuccess = () => resolve(request.result);
            }).catch((error) => {
              databasePromise = null;
              throw error;
            });
            return databasePromise;
          """.replace('          ', '')
          after = """  const pending = new Promise<IDBDatabase>((resolve, reject) => {
              if (!window.indexedDB) {
                reject(new Error('当前浏览器不支持本地可靠上传队列。'));
                return;
              }
              const request = window.indexedDB.open(DB_NAME, DB_VERSION);
              request.onerror = () => reject(request.error ?? new Error('本地上传队列打开失败。'));
              request.onupgradeneeded = () => {
                const database = request.result;
                if (!database.objectStoreNames.contains(STORE_NAME)) {
                  database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
              };
              request.onsuccess = () => resolve(request.result);
            }).catch((error): never => {
              databasePromise = null;
              throw error;
            });
            databasePromise = pending;
            return pending;
          """.replace('          ', '')
          if source.count(before) != 1:
              raise SystemExit(f'openDatabase anchor count={source.count(before)}')
          queue.write_text(source.replace(before, after, 1), encoding='utf-8')

          test_path = root / 'scripts/mobile-local-first-analysis.test.cjs'
          tests = test_path.read_text(encoding='utf-8')
          marker = "mobile outbox commits IndexedDB transactions and recovers expired upload leases"
          if marker not in tests:
              tests += r'''

          test('mobile outbox commits IndexedDB transactions and recovers expired upload leases', () => {
            const queue = text('src/utils/captureUploadQueue.ts');
            const app = text('src/App.tsx');
            assert.match(queue, /transactionDone/);
            assert.match(queue, /await committed/);
            assert.match(queue, /UPLOAD_LEASE_MS/);
            assert.match(queue, /job\.status !== 'uploading'/);
            assert.match(queue, /上次上传被系统中断/);
            assert.match(app, /installCaptureUploadResumer/);
          });
          '''
              test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci
      - name: Run all tests
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        run: |
          set -o pipefail
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          node --test "${test_files[@]}" 2>&1 | tee /tmp/durable-outbox-tests.log
      - name: Build production app
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        run: npm run build 2>&1 | tee /tmp/durable-outbox-build.log
      - name: Validate Worker bundle
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run
      - name: Upload final diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-outbox-${{ github.run_id }}
          path: |
            /tmp/durable-outbox-tests.log
            /tmp/durable-outbox-build.log
          if-no-files-found: warn
          retention-days: 3
      - name: Commit validated durable outbox
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-local-first-build.yml
          git config user.name 'Kaoyan Durable Outbox'
          git config user.email 'durable-outbox@local.invalid'
          git add -A -- \
            .github/workflows/diagnose-local-first-build.yml \
            outputs/kaoyan-schedule-app/src/utils/captureUploadQueue.ts \
            outputs/kaoyan-schedule-app/scripts/mobile-local-first-analysis.test.cjs
          git commit -m 'fix: make mobile capture outbox durable across Safari exits'
          git push origin HEAD:fix/mobile-local-first-analysis-parity
