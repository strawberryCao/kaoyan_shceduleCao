name: Apply mobile capture stability patch

on:
  push:
    branches:
      - agent/mobile-capture-stability-parity
  pull_request:
    branches:
      - fix/learning-detail-title-latex
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mobile-capture-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-capture-stability-parity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json

      - name: Apply focused patch
        run: node outputs/kaoyan-schedule-app/scripts/apply-mobile-capture-stability.cjs

      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci

      - name: Run mobile capture behavior tests
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node --test \
            scripts/mobile-capture-contract-behavior.test.cjs \
            scripts/mobile-local-first-analysis.test.cjs \
            scripts/cloud-capture-fast-pipeline.test.cjs \
            scripts/public-lan-parity.test.cjs 2>&1 | tee /tmp/mobile-capture-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### 移动端稳定性测试失败'
              echo
              echo '<details><summary>失败日志末尾</summary>'
              echo
              echo '```text'
              tail -n 180 /tmp/mobile-capture-tests.log
              echo '```'
              echo '</details>'
            } > /tmp/mobile-capture-comment.md
            gh pr comment 43 --repo strawberryCao/kaoyan_shceduleCao --body-file /tmp/mobile-capture-comment.md
            exit "$status"
          fi

      - name: Run production build
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build

      - name: Verify Worker bundle
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run

      - name: Commit verified production files
        run: |
          rm -f outputs/kaoyan-schedule-app/scripts/apply-mobile-capture-stability.cjs
          rm -f .github/workflows/agent-mobile-capture-stability.yml
          rm -f .ci/mobile-capture-test-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stabilize mobile multi-question capture and naming"
          git push origin HEAD:agent/mobile-capture-stability-parity
