name: Deploy validated recovery build to production
# Retry after portable V2 migration fixes.

on:
  push:
    branches:
      - codex/recovery-architecture-v2
    paths:
      - .github/workflows/deploy-kaoyan-production-recovery.yml

permissions:
  contents: read

concurrency:
  group: kaoyan-recovery-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAOYAN_APP_PASSWORD: ${{ secrets.KAOYAN_APP_PASSWORD }}
    defaults:
      run:
        working-directory: outputs/kaoyan-schedule-app
    steps:
      - name: Check out immutable recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID KAOYAN_APP_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "$name is missing" >&2; exit 2; }
          done

      - name: Validate exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          node --test "${test_files[@]}"
          npm run build

      - name: Deploy new production Worker version
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | tail -n 1 || true)"
          [[ -n "$worker_url" ]] || exit 3
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify protected production behavior
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl --silent --show-error -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$WORKER_URL/api/health" || true)"
            [[ "$status" == 200 ]] && break
            sleep 5
          done
          node -e "const v=require(process.argv[1]); if(!v.ok||!v.githubConfigured||v.publicRead||v.cloudDeleteEnabled) process.exit(1)" "$RUNNER_TEMP/health.json"
          login_status="$(curl --silent --show-error -c "$RUNNER_TEMP/cookies.txt" -o "$RUNNER_TEMP/login.json" -w '%{http_code}' -H 'Content-Type: application/json' --data "$(node -e "process.stdout.write(JSON.stringify({username:'caobiji',password:process.env.KAOYAN_APP_PASSWORD}))")" "$WORKER_URL/api/auth/login")"
          [[ "$login_status" == 200 ]]
          delete_status="$(curl --silent --show-error -b "$RUNNER_TEMP/cookies.txt" -o "$RUNNER_TEMP/delete.json" -w '%{http_code}' -X DELETE -H 'Content-Type: application/json' --data '{}' "$WORKER_URL/api/entries/deployment-probe")"
          [[ "$delete_status" == 405 ]]
          echo "Production: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
