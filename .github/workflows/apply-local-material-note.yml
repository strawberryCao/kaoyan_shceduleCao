name: Apply local material note support

on:
  workflow_dispatch:
  push:
    branches: [fix/learning-record-multimaterial-continuation]
    paths:
      - 'scripts/apply-local-material-note-server.cjs'
      - 'scripts/templates/local-material-handler.cjs.txt'
      - 'outputs/kaoyan-schedule-app/scripts/note-file-access.cjs'
      - 'outputs/kaoyan-schedule-app/scripts/note-file-material.test.cjs'
      - 'outputs/kaoyan-schedule-app/scripts/__tests__/material-note-flow.test.cjs'
      - '.github/workflows/apply-local-material-note.yml'
  pull_request:
    branches: [fix/learning-detail-title-latex]
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/apply-local-material-note-server.cjs'
      - 'scripts/templates/local-material-handler.cjs.txt'
      - 'outputs/kaoyan-schedule-app/scripts/note-file-access.cjs'
      - 'outputs/kaoyan-schedule-app/scripts/note-file-material.test.cjs'
      - 'outputs/kaoyan-schedule-app/scripts/__tests__/material-note-flow.test.cjs'
      - '.github/workflows/apply-local-material-note.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: local-material-note-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/learning-record-multimaterial-continuation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json

      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci --ignore-scripts

      - name: Apply local material server patch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          node scripts/apply-local-material-note-server.cjs > "$RUNNER_TEMP/local-transform.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/local-transform.log"
          if (( status != 0 )) && [[ -n "${PR_NUMBER:-}" ]]; then
            {
              echo '## 本地多资料服务补丁失败'
              echo
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/local-transform.log"
              echo '```'
            } > "$RUNNER_TEMP/local-transform-comment.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/local-transform-comment.md"
          fi
          exit "$status"

      - name: Normalize and validate local source
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [
              Path('outputs/kaoyan-schedule-app/scripts/note-server.cjs'),
              Path('outputs/kaoyan-schedule-app/scripts/note-file-access.cjs'),
              Path('outputs/kaoyan-schedule-app/scripts/note-file-material.test.cjs'),
              Path('outputs/kaoyan-schedule-app/scripts/__tests__/material-note-flow.test.cjs'),
          ]:
              text = path.read_text(encoding='utf-8')
              path.write_text('\n'.join(line.rstrip(' \t') for line in text.split('\n')), encoding='utf-8')
          PY
          node --check outputs/kaoyan-schedule-app/scripts/note-server.cjs
          node --check outputs/kaoyan-schedule-app/scripts/note-file-access.cjs
          git diff --check

      - name: Run local material tests
        working-directory: outputs/kaoyan-schedule-app
        run: |
          node --test scripts/note-file-material.test.cjs
          node --test scripts/__tests__/material-note-flow.test.cjs
          node --test scripts/__tests__/note-save-flow.test.cjs

      - name: Run full automated suite
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        env:
          CAOBIJI_GITHUB_TOKEN: ''
        run: |
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          (( ${#test_files[@]} > 0 ))
          node --test --test-concurrency=1 "${test_files[@]}"

      - name: Build application
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build

      - name: Commit verified local server source
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/kaoyan-schedule-app/scripts/note-server.cjs
          if git diff --cached --quiet; then
            echo 'No local server changes remain.'
            exit 0
          fi
          git commit -m 'feat: add local text and multimaterial note storage'
          git push origin HEAD:fix/learning-record-multimaterial-continuation
