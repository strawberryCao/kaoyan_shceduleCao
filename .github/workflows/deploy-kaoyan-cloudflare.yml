name: Deploy validated kaoyan Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy preview first; production requires an explicit second run.
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: kaoyan-cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cloudflare-${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAOYAN_APP_PASSWORD: ${{ secrets.KAOYAN_APP_PASSWORD }}
      KAOYAN_SESSION_SECRET: ${{ secrets.KAOYAN_SESSION_SECRET }}
      CAOBIJI_GITHUB_TOKEN: ${{ secrets.CAOBIJI_GITHUB_TOKEN }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      DATA_REPOSITORY: strawberryCao/Caobijidata
    defaults:
      run:
        working-directory: outputs/kaoyan-schedule-app
    steps:
      - name: Check out the immutable dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Record deployment source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]]
          echo "Deploying immutable commit $actual to ${{ inputs.target }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json

      - name: Verify required protected inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID KAOYAN_APP_PASSWORD KAOYAN_SESSION_SECRET CAOBIJI_GITHUB_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "$name is missing" >&2; exit 2; }
          done
          (( ${#KAOYAN_SESSION_SECRET} >= 32 )) || { echo 'KAOYAN_SESSION_SECRET must be at least 32 characters' >&2; exit 2; }

      - name: Refuse deployment while the data repository is public
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $CAOBIJI_GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$DATA_REPOSITORY" > "$RUNNER_TEMP/data-repository.json"
          node -e "const v=require(process.argv[1]); if(v.private!==true||v.full_name!=='strawberryCao/Caobijidata') process.exit(1)" "$RUNNER_TEMP/data-repository.json"

      - name: Install and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          node --test "${test_files[@]}"
          npm run build

      - name: Select Wrangler environment
        id: target
        shell: bash
        run: |
          if [[ '${{ inputs.target }}' == 'preview' ]]; then
            echo 'args=--env preview' >> "$GITHUB_OUTPUT"
          else
            echo 'args=' >> "$GITHUB_OUTPUT"
          fi

      - name: Create preview Worker before adding its first secrets
        if: inputs.target == 'preview'
        run: npx wrangler deploy ${{ steps.target.outputs.args }}

      - name: Configure server-only secrets
        shell: bash
        run: |
          set -euo pipefail
          target_args=()
          if [[ '${{ inputs.target }}' == 'preview' ]]; then target_args=(--env preview); fi
          printf '%s' "$KAOYAN_APP_PASSWORD" | npx wrangler secret put APP_PASSWORD "${target_args[@]}"
          printf '%s' "$KAOYAN_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET "${target_args[@]}"
          printf '%s' "$CAOBIJI_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN "${target_args[@]}"
          for name in QWEN_API_KEY GEMINI_API_KEY KIMI_API_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx wrangler secret put "$name" "${target_args[@]}"
            fi
          done

      - name: Deploy validated Worker version
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy ${{ steps.target.outputs.args }} 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | tail -n 1 || true)"
          [[ -n "$worker_url" ]] || { tail -n 100 "$RUNNER_TEMP/wrangler-deploy.log" >&2; exit 3; }
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify login, protected reads and disabled cloud deletion
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            status="$(curl --silent --show-error -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$WORKER_URL/api/health" || true)"
            [[ "$status" == 200 ]] && break
            sleep 5
          done
          node -e "const v=require(process.argv[1]); if(!v.ok||v.storage!=='github'||!v.githubConfigured||v.cloudDeleteEnabled||v.publicRead) process.exit(1)" "$RUNNER_TEMP/health.json"
          login_status="$(curl --silent --show-error -c "$RUNNER_TEMP/cookies.txt" -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "$(node -e "process.stdout.write(JSON.stringify({username:'caobiji',password:process.env.KAOYAN_APP_PASSWORD}))")" \
            "$WORKER_URL/api/auth/login")"
          [[ "$login_status" == 200 ]]
          curl --fail --silent --show-error -b "$RUNNER_TEMP/cookies.txt" "$WORKER_URL/api/auth/status" > "$RUNNER_TEMP/status.json"
          node -e "const v=require(process.argv[1]); if(!v.authenticated||!v.dedicatedSessionSecret) process.exit(1)" "$RUNNER_TEMP/status.json"
          delete_status="$(curl --silent --show-error -b "$RUNNER_TEMP/cookies.txt" -o "$RUNNER_TEMP/delete.json" -w '%{http_code}' \
            -X DELETE -H 'Content-Type: application/json' --data '{}' "$WORKER_URL/api/entries/deployment-probe")"
          [[ "$delete_status" == 405 ]]
          node -e "const v=require(process.argv[1]); if(v.code!=='CLOUD_DELETE_DISABLED') process.exit(1)" "$RUNNER_TEMP/delete.json"

      - name: Publish deployment summary
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          {
            echo "## Kaoyan ${{ inputs.target }} deployment"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Worker: $WORKER_URL"
            echo "- Data repository privacy gate: passed"
            echo "- Session login and cloud delete 405: passed"
          } >> "$GITHUB_STEP_SUMMARY"
