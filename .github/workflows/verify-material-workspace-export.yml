name: Verify material workspace export

on:
  pull_request:
    branches: [agent/lossless-learning-sync-quick-ui]
    types: [reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/material-workspace-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json
      - name: Apply secure preview backend patch
        run: node outputs/kaoyan-schedule-app/scripts/apply-material-workspace-backend.cjs
      - name: Install and lock real DOCX generator
        working-directory: outputs/kaoyan-schedule-app
        run: npm install docx --save --ignore-scripts
      - name: Run focused material behavior tests
        working-directory: outputs/kaoyan-schedule-app
        run: >-
          node --test
          scripts/note-file-material.test.cjs
          scripts/__tests__/material-note-flow.test.cjs
          cloudflare/media-material.test.mjs
          cloudflare/learning-multimaterial.test.mjs
      - name: Run complete Node regression suite
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' tests < <(find scripts cloudflare -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.test.js' \) -print0 | sort -z)
          set +e
          node --test "${tests[@]}" 2>&1 | tee /tmp/material-full.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### 资料工作区全量回归失败（精简定位）'
              echo
              echo '```text'
              grep -nE '^not ok|AssertionError|TestContext\.<anonymous>|operator:|ERR_|^[[:space:]]*error:' /tmp/material-full.log | tail -n 180
              echo '```'
            } > /tmp/material-comment.md
            gh pr comment 45 --repo strawberryCao/kaoyan_shceduleCao --body-file /tmp/material-comment.md
            exit "$status"
          fi
      - name: Build production app
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build
      - name: Dry-run Cloudflare Worker
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run
      - name: Commit verified clean source
        shell: bash
        run: |
          rm -f .github/workflows/verify-material-workspace-export.yml
          rm -f outputs/kaoyan-schedule-app/scripts/apply-material-workspace-backend.cjs
          git fetch origin agent/lossless-learning-sync-quick-ui
          base=$(git rev-parse origin/agent/lossless-learning-sync-quick-ui)
          git add -A
          while IFS= read -r -d '' file; do
            if git cat-file -e "${base}:${file}" 2>/dev/null; then
              blob=$(git rev-parse "${base}:${file}")
              git update-index --cacheinfo "100644,${blob},${file}"
            fi
          done < <(find outputs/kaoyan-schedule-app -maxdepth 1 -type f -name '*.cmd' -print0)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "add secure material workspace previews and exports"
          git push origin HEAD:agent/material-workspace-export
