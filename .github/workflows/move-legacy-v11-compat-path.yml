name: Move legacy V11 compatibility path

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    paths:
      - '.github/patches/move-legacy-v11-compat-path.py'
      - '.github/workflows/move-legacy-v11-compat-path.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'fix/legacy-v11-compat-persistent-path'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-v11-compat-persistent-path
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json
      - name: Move compatibility loader to the persistent control-plane path
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/patches/move-legacy-v11-compat-path.py
          python3 .github/patches/move-legacy-v11-compat-path.py
          node --check outputs/kaoyan-schedule-app/cloudflare/agent-runtime.js
      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci
      - name: Run complete test suite
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        run: |
          set -o pipefail
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          node --test "${test_files[@]}" 2>&1 | tee /tmp/persistent-compat-tests.log
      - name: Build production app
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build
      - name: Validate Worker bundle
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-compat-${{ github.run_id }}
          path: /tmp/persistent-compat-tests.log
          if-no-files-found: warn
          retention-days: 3
      - name: Commit validated business files only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/move-legacy-v11-compat-path.py
          rm -f .github/workflows/move-legacy-v11-compat-path.yml
          git config user.name 'Kaoyan Compatibility Path Fix'
          git config user.email 'compat-path-fix@local.invalid'
          git add -A -- \
            .github/patches/move-legacy-v11-compat-path.py \
            .github/workflows/move-legacy-v11-compat-path.yml \
            outputs/kaoyan-schedule-app/cloudflare/agent-runtime.js \
            outputs/kaoyan-schedule-app/scripts/legacy-v11-runtime-compat.test.mjs \
            outputs/kaoyan-schedule-app/scripts/mobile-local-first-analysis.test.cjs
          git commit -m 'fix: keep legacy V11 compatibility outside sync-owned data'
          git push origin HEAD:fix/legacy-v11-compat-persistent-path
