name: Diagnose live note capture

on:
  push:
    branches: [fix/learning-detail-title-latex]
    paths: ['.github/workflows/diagnose-live-note-capture.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      APP_USERNAME: caobiji
      KAOYAN_APP_PASSWORD: ${{ secrets.KAOYAN_APP_PASSWORD }}
      WORKER_URL: https://kaoyan-study-center.caoheming139.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/learning-detail-title-latex
      - name: Generate deterministic question image
        shell: bash
        run: |
          python3 - <<'PY'
          import binascii, struct, zlib
          w, h = 900, 1200
          rows = []
          for y in range(h):
              row = bytearray([255] * (w * 3))
              def black(x1, x2):
                  for x in range(max(0,x1), min(w,x2)):
                      row[x*3:x*3+3] = b'\x10\x10\x10'
              for top in (80, 420, 760):
                  if top <= y < top + 8: black(55, 845)
                  if top + 40 <= y < top + 48: black(80, 700)
                  if top + 90 <= y < top + 98: black(80, 820)
                  if top + 150 <= y < top + 158: black(120, 780)
                  if top + 220 <= y < top + 228: black(80, 500)
              rows.append(b'\x00' + bytes(row))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w,h,8,2,0,0,0)) + chunk(b'IDAT', zlib.compress(b''.join(rows),9)) + chunk(b'IEND', b'')
          open('/tmp/probe.png','wb').write(png)
          PY
          base64 -w0 /tmp/probe.png > /tmp/probe.b64
      - name: Probe production APIs
        id: probe
        shell: bash
        run: |
          set -u
          auth="Basic $(printf '%s' "$APP_USERNAME:$KAOYAN_APP_PASSWORD" | base64 -w0)"
          data_url="data:image/png;base64,$(cat /tmp/probe.b64)"
          health_status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$WORKER_URL/api/health" || true)
          learning_status=$(curl -sS -o /tmp/learning.json -w '%{http_code}' -H "Authorization: $auth" "$WORKER_URL/api/learning-data" || true)
          cat > /tmp/save-payload.json <<JSON
          {"imageDataUrl":"$data_url","kind":"single","noteUid":"diagnostic_capture_probe_v1","subject":"系统诊断","remark":"线上拍题链路探针，可忽略","sourceType":"diagnostic-live-capture","tags":["系统诊断"]}
          JSON
          save_status=$(curl -sS -o /tmp/save.json -w '%{http_code}' -X POST -H "Authorization: $auth" -H 'Content-Type: application/json' --data-binary @/tmp/save-payload.json "$WORKER_URL/api/save-note" || true)
          cat > /tmp/detect-payload.json <<JSON
          {"imageDataUrl":"$data_url","imageWidth":900,"imageHeight":1200}
          JSON
          detect_status=$(curl -sS -o /tmp/detect.json -w '%{http_code}' -X POST -H "Authorization: $auth" -H 'Content-Type: application/json' --data-binary @/tmp/detect-payload.json "$WORKER_URL/api/ai/detect-questions" || true)
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return { raw: fs.readFileSync(p,'utf8').slice(0,5000) }; } };
          const result = {
            schemaVersion: 1,
            testedAt: new Date().toISOString(),
            workerUrl: process.env.WORKER_URL,
            health: { status: Number(process.env.health_status || 0), body: read('/tmp/health.json') },
            learning: { status: Number(process.env.learning_status || 0), body: read('/tmp/learning.json') },
            saveNote: { status: Number(process.env.save_status || 0), body: read('/tmp/save.json') },
            detectQuestions: { status: Number(process.env.detect_status || 0), body: read('/tmp/detect.json') },
          };
          fs.writeFileSync('/tmp/live-note-capture.json', JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({health: result.health.status, learning: result.learning.status, save: result.saveNote.status, detect: result.detectQuestions.status}));
          NODE
        env:
          health_status: ${{ env.health_status }}
          learning_status: ${{ env.learning_status }}
          save_status: ${{ env.save_status }}
          detect_status: ${{ env.detect_status }}
      - name: Rebuild diagnostic with shell statuses
        shell: bash
        run: |
          auth="Basic $(printf '%s' "$APP_USERNAME:$KAOYAN_APP_PASSWORD" | base64 -w0)"
          data_url="data:image/png;base64,$(cat /tmp/probe.b64)"
          health_status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$WORKER_URL/api/health" || true)
          learning_status=$(curl -sS -o /tmp/learning.json -w '%{http_code}' -H "Authorization: $auth" "$WORKER_URL/api/learning-data" || true)
          save_status=$(curl -sS -o /tmp/save.json -w '%{http_code}' -X POST -H "Authorization: $auth" -H 'Content-Type: application/json' --data-binary @/tmp/save-payload.json "$WORKER_URL/api/save-note" || true)
          detect_status=$(curl -sS -o /tmp/detect.json -w '%{http_code}' -X POST -H "Authorization: $auth" -H 'Content-Type: application/json' --data-binary @/tmp/detect-payload.json "$WORKER_URL/api/ai/detect-questions" || true)
          HEALTH_STATUS=$health_status LEARNING_STATUS=$learning_status SAVE_STATUS=$save_status DETECT_STATUS=$detect_status node <<'NODE'
          const fs=require('fs'); const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return{raw:fs.readFileSync(p,'utf8').slice(0,5000)}}};
          const result={schemaVersion:1,testedAt:new Date().toISOString(),workerUrl:process.env.WORKER_URL,
            health:{status:+process.env.HEALTH_STATUS,body:read('/tmp/health.json')},
            learning:{status:+process.env.LEARNING_STATUS,body:read('/tmp/learning.json')},
            saveNote:{status:+process.env.SAVE_STATUS,body:read('/tmp/save.json')},
            detectQuestions:{status:+process.env.DETECT_STATUS,body:read('/tmp/detect.json')}};
          fs.writeFileSync('/tmp/live-note-capture.json',JSON.stringify(result,null,2)+'\n');
          NODE
      - name: Persist diagnostic receipt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'fix/learning-detail-title-latex';
            const path = 'deployment-receipts/live-note-capture-diagnostic.json';
            const content = fs.readFileSync('/tmp/live-note-capture.json');
            let sha;
            try { const current = await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch}); if(!Array.isArray(current.data)) sha=current.data.sha; }
            catch(error){ if(error.status!==404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch,message:'diagnostic: record live note capture result',content:content.toString('base64'),...(sha?{sha}:{})});
