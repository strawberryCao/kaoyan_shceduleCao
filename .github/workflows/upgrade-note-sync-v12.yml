name: Upgrade note synchronization V12

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    paths:
      - '.github/patches/upgrade-note-sync-v12.py'
      - '.github/workflows/upgrade-note-sync-v12.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.head_ref == 'fix/mobile-local-first-analysis-parity'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-local-first-analysis-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V12 installer update
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/patches/upgrade-note-sync-v12.py
      - name: Validate UTF-8 BOM and Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Resolve-Path 'outputs/kaoyan-schedule-app/scripts/install-note-folder-sync.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'install-note-folder-sync.ps1 must be UTF-8 with BOM for Windows PowerShell 5.1.'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($installer, [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("line {0}, column {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            throw 'V12 installer failed Windows PowerShell 5.1 parsing.'
          }
      - name: Validate V12 installer and shared workflow contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          path = Path('outputs/kaoyan-schedule-app/scripts/install-note-folder-sync.ps1')
          text = path.read_text(encoding='utf-8-sig')
          required = [
              "$version = '20260726-mobile-local-first-v12'",
              'version = 12',
              "'agent-workflow-contracts.cjs'",
              "'note-ai-analyzer.cjs'",
              "'export-agent-runtime.cjs'",
              'Install-ScriptFile $dependency',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'V12 installer contract missing: {missing}')
          legacy = [item for item in ['public-lan-parity-v11', 'version = 11'] if item in text]
          if legacy:
              raise SystemExit(f'Legacy V11 identifiers remain: {legacy}')
          contracts = Path('outputs/kaoyan-schedule-app/scripts/agent-workflow-contracts.cjs').read_text(encoding='utf-8')
          versions = ['note-enrichment-v4', 'note-image-understanding-v4', 'note-naming-v3', 'question-splitting-v3']
          missing_versions = [item for item in versions if item not in contracts]
          if missing_versions:
              raise SystemExit(f'Shared LAN workflow contracts missing: {missing_versions}')
          print('V12 installer and shared LAN workflow contracts verified.')
          '@ | python -
      - name: Commit validated V12 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/patches/upgrade-note-sync-v12.py' -Force
          Remove-Item '.github/workflows/upgrade-note-sync-v12.yml' -Force
          git config user.name 'Kaoyan Sync V12'
          git config user.email 'sync-v12@local.invalid'
          git add -A -- .github/patches/upgrade-note-sync-v12.py .github/workflows/upgrade-note-sync-v12.yml outputs/kaoyan-schedule-app/scripts
          git commit -m 'feat: upgrade Windows synchronization runtime to V12'
          git push origin HEAD:fix/mobile-local-first-analysis-parity
