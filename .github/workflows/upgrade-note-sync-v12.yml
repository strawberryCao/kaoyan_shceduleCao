name: Upgrade note synchronization V12

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    paths:
      - '.github/patches/upgrade-note-sync-v12.py'
      - '.github/workflows/upgrade-note-sync-v12.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.head_ref == 'fix/mobile-local-first-analysis-parity'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-local-first-analysis-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate V12 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/patches/upgrade-note-sync-v12.py

          $installer = Resolve-Path 'outputs/kaoyan-schedule-app/scripts/install-note-folder-sync.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'install-note-folder-sync.ps1 must be UTF-8 with BOM for Windows PowerShell 5.1.'
          }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($installer, [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("line {0}, column {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            throw 'V12 installer failed Windows PowerShell 5.1 parsing.'
          }

          $text = Get-Content -LiteralPath $installer -Raw -Encoding UTF8
          foreach ($required in @(
            "`$version = '20260726-mobile-local-first-v12'",
            'version = 12',
            '全局同步 v12 已启用。',
            "Install-ScriptFile 'agent-workflow-contracts.cjs'",
            "Install-ScriptFile 'note-ai-analyzer.cjs'",
            "Install-ScriptFile 'export-agent-runtime.cjs'"
          )) {
            if (-not $text.Contains($required)) { throw "V12 installer contract is missing: $required" }
          }
          if ($text.Contains('public-lan-parity-v11') -or $text.Contains('version = 11') -or $text.Contains('全局同步 v11')) {
            throw 'Legacy V11 installer identifiers remain.'
          }

          node -e "const fs=require('fs'); const p='outputs/kaoyan-schedule-app/scripts/agent-workflow-contracts.cjs'; const s=fs.readFileSync(p,'utf8'); for(const v of ['note-enrichment-v4','note-image-understanding-v4','note-naming-v3','question-splitting-v3']) if(!s.includes(v)) throw new Error('missing '+v); console.log('Shared LAN workflow contracts verified.');"
      - name: Commit validated V12 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/patches/upgrade-note-sync-v12.py' -Force
          Remove-Item '.github/workflows/upgrade-note-sync-v12.yml' -Force
          git config user.name 'Kaoyan Sync V12'
          git config user.email 'sync-v12@local.invalid'
          git add -A -- .github/patches/upgrade-note-sync-v12.py .github/workflows/upgrade-note-sync-v12.yml outputs/kaoyan-schedule-app/scripts
          git commit -m 'feat: upgrade Windows synchronization runtime to V12'
          git push origin HEAD:fix/mobile-local-first-analysis-parity
