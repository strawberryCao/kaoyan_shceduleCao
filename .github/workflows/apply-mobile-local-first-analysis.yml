name: Apply mobile local-first analysis parity

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    paths:
      - '.github/patches/apply-mobile-local-first-analysis.py'
      - '.github/workflows/apply-mobile-local-first-analysis.yml'
      - 'outputs/kaoyan-schedule-app/src/utils/captureUploadQueue.ts'
      - 'outputs/kaoyan-schedule-app/cloudflare/note-analysis-job.js'
      - 'outputs/kaoyan-schedule-app/cloudflare/background-jobs.js'
      - 'outputs/kaoyan-schedule-app/scripts/agent-workflow-contracts.cjs'
      - 'outputs/kaoyan-schedule-app/scripts/mobile-local-first-analysis.test.cjs'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/mobile-local-first-analysis-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-local-first-analysis-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json
      - name: Apply deterministic integration
        shell: bash
        run: |
          set -o pipefail
          {
            python3 -m py_compile .github/patches/apply-mobile-local-first-analysis.py
            python3 .github/patches/apply-mobile-local-first-analysis.py
            node --check outputs/kaoyan-schedule-app/cloudflare/learning.js
            node --check outputs/kaoyan-schedule-app/cloudflare/rename-job.js
            node --check outputs/kaoyan-schedule-app/cloudflare/note-analysis-job.js
            node --check outputs/kaoyan-schedule-app/cloudflare/background-jobs.js
            node --check outputs/kaoyan-schedule-app/cloudflare/media.js
            node --check outputs/kaoyan-schedule-app/cloudflare/agent-runtime.js
            node --check outputs/kaoyan-schedule-app/scripts/agent-workflow-contracts.cjs
          } 2>&1 | tee /tmp/mobile-local-first-patch.log
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-local-first-patch-${{ github.run_id }}
          path: /tmp/mobile-local-first-patch.log
          if-no-files-found: warn
          retention-days: 3
      - name: Prepare clean business commit
        run: |
          set -euo pipefail
          rm -f .github/patches/apply-mobile-local-first-analysis.py
          rm -f .github/workflows/apply-mobile-local-first-analysis.yml
          git config user.name 'Kaoyan Local First Fix'
          git config user.email 'local-first-fix@local.invalid'
          git add -A -- \
            .github/patches/apply-mobile-local-first-analysis.py \
            .github/workflows/apply-mobile-local-first-analysis.yml \
            outputs/kaoyan-schedule-app/src/utils/captureUploadQueue.ts \
            outputs/kaoyan-schedule-app/src/components/NoteDropApp.tsx \
            outputs/kaoyan-schedule-app/cloudflare/agent-runtime.js \
            outputs/kaoyan-schedule-app/cloudflare/background-jobs.js \
            outputs/kaoyan-schedule-app/cloudflare/learning.js \
            outputs/kaoyan-schedule-app/cloudflare/media.js \
            outputs/kaoyan-schedule-app/cloudflare/note-analysis-job.js \
            outputs/kaoyan-schedule-app/cloudflare/rename-job.js \
            outputs/kaoyan-schedule-app/scripts/agent-workflow-contracts.cjs \
            outputs/kaoyan-schedule-app/scripts/mobile-local-first-analysis.test.cjs
          git commit -m 'feat: make mobile capture local-first with full LAN analysis'
      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci
      - name: Run all automated tests
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        run: |
          set -o pipefail
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          (( ${#test_files[@]} > 0 ))
          node --test "${test_files[@]}" 2>&1 | tee /tmp/mobile-local-first-tests.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-local-first-tests-${{ github.run_id }}
          path: /tmp/mobile-local-first-tests.log
          if-no-files-found: warn
          retention-days: 3
      - name: Build production app
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build
      - name: Validate Worker bundle
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run
      - name: Push validated business commit
        run: git push origin HEAD:fix/mobile-local-first-analysis-parity
