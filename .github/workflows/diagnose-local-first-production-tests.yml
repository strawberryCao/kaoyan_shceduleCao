name: Diagnose local-first production tests

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    paths:
      - '.github/workflows/diagnose-local-first-production-tests.yml'

jobs:
  diagnose:
    if: github.head_ref == 'fix/local-first-production-test-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-first-production-test-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json
      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci
      - name: Run exact production test command
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        run: |
          set -o pipefail
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          (( ${#test_files[@]} > 0 ))
          node --test "${test_files[@]}" 2>&1 | tee /tmp/local-first-production-tests.log
      - name: Upload complete test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-first-production-tests-${{ github.run_id }}
          path: /tmp/local-first-production-tests.log
          if-no-files-found: error
          retention-days: 3
