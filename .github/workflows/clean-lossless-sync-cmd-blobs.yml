name: Clean lossless sync PR launcher blobs

on:
  pull_request:
    branches: [agent/mobile-capture-stability-parity]
    types: [reopened]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lossless-learning-sync-quick-ui
          fetch-depth: 0
      - name: Reset exact base index blobs
        shell: bash
        run: |
          base='4bbef9326c9d93fb84a796da9b590945b8d31baa'
          git fetch origin "$base"
          files=(
            'outputs/kaoyan-schedule-app/取消开机自启.cmd'
            'outputs/kaoyan-schedule-app/安装依赖.cmd'
            'outputs/kaoyan-schedule-app/导入敦煌壁纸图片.cmd'
            'outputs/kaoyan-schedule-app/收集环境信息.cmd'
            'outputs/kaoyan-schedule-app/整理笔记元数据.cmd'
            'outputs/kaoyan-schedule-app/测试千问连接.cmd'
            'outputs/kaoyan-schedule-app/生成敦煌动态壁纸视频.cmd'
            'outputs/kaoyan-schedule-app/设置开机自启.cmd'
            'outputs/kaoyan-schedule-app/配置千问命名.cmd'
          )
          rm -f .github/workflows/clean-lossless-sync-cmd-blobs.yml
          git add -A
          for file in "${files[@]}"; do
            blob=$(git rev-parse "${base}:${file}")
            git update-index --cacheinfo "100644,${blob},${file}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "restore exact unrelated Windows launcher blobs"
          git push origin HEAD:agent/lossless-learning-sync-quick-ui
