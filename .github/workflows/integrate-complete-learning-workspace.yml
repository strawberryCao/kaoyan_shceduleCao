name: Integrate complete learning workspace

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: complete-learning-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.head_ref == 'integration/complete-learning-capture-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/complete-learning-capture-workspace
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json

      - name: Restore baseline and apply missing business source
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/learning-detail-title-latex agent/instant-capture-background-split

          app=outputs/kaoyan-schedule-app/src/components/NoteDropApp.tsx
          if ! grep -q "enqueueMultiQuestionJob" "$app"; then
            mkdir -p outputs/kaoyan-schedule-app/scripts
            git show origin/agent/instant-capture-background-split:outputs/kaoyan-schedule-app/scripts/apply-instant-capture-background-split.cjs > outputs/kaoyan-schedule-app/scripts/apply-instant-capture-background-split.cjs
            git show origin/agent/instant-capture-background-split:outputs/kaoyan-schedule-app/scripts/run-instant-capture-background-patch.cjs > outputs/kaoyan-schedule-app/scripts/run-instant-capture-background-patch.cjs
            (cd outputs/kaoyan-schedule-app && node scripts/run-instant-capture-background-patch.cjs)
            rm -f outputs/kaoyan-schedule-app/scripts/apply-instant-capture-background-split.cjs
            rm -f outputs/kaoyan-schedule-app/scripts/run-instant-capture-background-patch.cjs
          fi

          git add -A

          # Restore exact baseline blobs in the index. This bypasses Linux line-ending
          # conversion and prevents unrelated Windows launch scripts entering the PR.
          command_files=(
            outputs/kaoyan-schedule-app/取消开机自启.cmd
            outputs/kaoyan-schedule-app/安装依赖.cmd
            outputs/kaoyan-schedule-app/导入敦煌壁纸图片.cmd
            outputs/kaoyan-schedule-app/收集环境信息.cmd
            outputs/kaoyan-schedule-app/整理笔记元数据.cmd
            outputs/kaoyan-schedule-app/测试千问连接.cmd
            outputs/kaoyan-schedule-app/生成敦煌动态壁纸视频.cmd
            outputs/kaoyan-schedule-app/设置开机自启.cmd
            outputs/kaoyan-schedule-app/配置千问命名.cmd
          )
          for file in "${command_files[@]}"; do
            blob=$(git rev-parse "origin/fix/learning-detail-title-latex:$file")
            mode=$(git ls-tree origin/fix/learning-detail-title-latex -- "$file" | awk '{print $1}')
            git update-index --cacheinfo "$mode,$blob,$file"
          done

          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat: complete instant capture and background multi-question flow"
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Push generated final source
        if: steps.apply.outputs.changed == '1'
        run: git push origin HEAD:integration/complete-learning-capture-workspace

      - name: Install dependencies without mutation hooks
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci --ignore-scripts

      - name: Run integrated acceptance tests
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.test.cjs; do node "$file"; done
          for file in cloudflare/*.test.mjs; do node "$file"; done

      - name: Build production app
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build

      - name: Dry-run Cloudflare Worker
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run
