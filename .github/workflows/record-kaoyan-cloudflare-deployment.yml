name: Record kaoyan Cloudflare deployment

on:
  workflow_run:
    workflows: ['Deploy kaoyan study center to Cloudflare']
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'fix/learning-detail-title-latex'
    runs-on: ubuntu-latest
    steps:
      - name: Write latest deployment receipt
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const branch = 'fix/learning-detail-title-latex';
            const path = 'deployment-receipts/kaoyan-cloudflare-latest.json';
            const receipt = {
              schemaVersion: 1,
              workflow: run.name,
              runId: run.id,
              runNumber: run.run_number,
              event: run.event,
              conclusion: run.conclusion,
              sourceBranch: run.head_branch,
              sourceCommit: run.head_sha,
              runUrl: run.html_url,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              recordedAt: new Date().toISOString(),
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `deployment: record Cloudflare run ${run.run_number} (${run.conclusion})`,
              content: Buffer.from(`${JSON.stringify(receipt, null, 2)}\n`).toString('base64'),
              ...(sha ? { sha } : {}),
            });
