name: Validate kaoyan app changes

on:
  push:
    branches: [fix/public-lan-parity-control-plane]
    paths:
      - '.github/scripts/**public-lan*'
      - '.github/workflows/validate-kaoyan-app.yml'
  pull_request:
    branches:
      - fix/learning-detail-title-latex
      - fix/public-lan-parity-control-plane
    paths:
      - 'outputs/kaoyan-schedule-app/**'
      - '.github/scripts/**public-lan*'
      - '.github/workflows/validate-kaoyan-app.yml'
      - '.github/validation/public-lan-parity-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-kaoyan-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'fix/public-lan-parity-control-plane' && 'fix/public-lan-parity-control-plane' || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json
      - name: Create clean public LAN parity delivery branch
        if: (github.event_name == 'push' && github.ref_name == 'fix/public-lan-parity-control-plane') || (github.event_name == 'pull_request' && github.base_ref == 'fix/public-lan-parity-control-plane')
        run: bash .github/scripts/create-public-lan-clean-branch.sh
      - name: Upload clean delivery diagnostics
        if: always() && ((github.event_name == 'push' && github.ref_name == 'fix/public-lan-parity-control-plane') || (github.event_name == 'pull_request' && github.base_ref == 'fix/public-lan-parity-control-plane'))
        uses: actions/upload-artifact@v4
        with:
          name: public-lan-clean-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            .github/validation/public-lan-clean-status.json
            /tmp/public-lan-clean.log
      - name: Validate PowerShell syntax
        if: github.event_name != 'push' && github.base_ref != 'fix/public-lan-parity-control-plane'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem outputs/kaoyan-schedule-app/scripts -Filter '*note-folder-sync.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("{0}: {1}" -f $_.FullName, (($errors | ForEach-Object Message) -join '; '))
            }
          }
          if ($failed) { exit 1 }
      - name: Install dependencies
        if: github.event_name != 'push' && github.base_ref != 'fix/public-lan-parity-control-plane'
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci
      - name: Run automated tests
        if: github.event_name != 'push' && github.base_ref != 'fix/public-lan-parity-control-plane'
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          (( ${#test_files[@]} > 0 ))
          node --test "${test_files[@]}"
      - name: Build production app
        if: github.event_name != 'push' && github.base_ref != 'fix/public-lan-parity-control-plane'
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build
      - name: Validate Worker bundle
        if: github.event_name != 'push' && github.base_ref != 'fix/public-lan-parity-control-plane'
        working-directory: outputs/kaoyan-schedule-app
        run: npx wrangler deploy --dry-run
