name: Apply multimaterial media and capture UI

on:
  workflow_dispatch:
  push:
    branches: [fix/learning-record-multimaterial-continuation]
    paths:
      - 'scripts/apply-multimaterial-media-ui.cjs'
      - 'scripts/repair-multimaterial-media-ui-transform.cjs'
      - '.github/workflows/apply-multimaterial-media-ui.yml'
  pull_request:
    branches: [fix/learning-detail-title-latex]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: multimaterial-media-ui-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/learning-record-multimaterial-continuation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outputs/kaoyan-schedule-app/package-lock.json

      - name: Install dependencies
        working-directory: outputs/kaoyan-schedule-app
        run: npm ci --ignore-scripts

      - name: Repair transform source
        run: node scripts/repair-multimaterial-media-ui-transform.cjs

      - name: Apply media and UI continuation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          node scripts/apply-multimaterial-media-ui.cjs > "$RUNNER_TEMP/transform.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/transform.log"
          if (( status != 0 )) && [[ -n "${PR_NUMBER:-}" ]]; then
            {
              echo '## 多资料媒体 / UI 变换失败'
              echo
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/transform.log"
              echo '```'
            } > "$RUNNER_TEMP/transform-comment.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/transform-comment.md"
          fi
          exit "$status"

      - name: Normalize generated whitespace
        shell: python
        run: |
          from pathlib import Path
          paths = [
              Path('outputs/kaoyan-schedule-app/cloudflare/media.js'),
              Path('outputs/kaoyan-schedule-app/cloudflare/github-store.js'),
              Path('outputs/kaoyan-schedule-app/cloudflare/worker.js'),
              Path('outputs/kaoyan-schedule-app/cloudflare/media-material.test.mjs'),
              Path('outputs/kaoyan-schedule-app/src/utils/notes.ts'),
              Path('outputs/kaoyan-schedule-app/src/components/QuickMaterialComposer.tsx'),
              Path('outputs/kaoyan-schedule-app/src/components/NoteDropApp.tsx'),
              Path('outputs/kaoyan-schedule-app/src/components/LearningCenter.tsx'),
              Path('outputs/kaoyan-schedule-app/src/quick-material-composer.css'),
              Path('outputs/kaoyan-schedule-app/src/learning-center.css'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              path.write_text('\n'.join(line.rstrip(' \t') for line in text.split('\n')), encoding='utf-8')

      - name: Validate generated source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          {
            node --check outputs/kaoyan-schedule-app/cloudflare/media.js
            node --check outputs/kaoyan-schedule-app/cloudflare/github-store.js
            node --check outputs/kaoyan-schedule-app/cloudflare/worker.js
            git diff --check
          } > "$RUNNER_TEMP/validation.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/validation.log"
          if (( status != 0 )) && [[ -n "${PR_NUMBER:-}" ]]; then
            {
              echo '## 多资料生成源码校验失败'
              echo
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/validation.log"
              echo '```'
            } > "$RUNNER_TEMP/validation-comment.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/validation-comment.md"
          fi
          exit "$status"

      - name: Run material tests
        working-directory: outputs/kaoyan-schedule-app
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          {
            node --test cloudflare/media-material.test.mjs cloudflare/learning-multimaterial.test.mjs
            node --test scripts/learning-multimaterial.test.cjs
          } > "$RUNNER_TEMP/material-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/material-tests.log"
          if (( status != 0 )) && [[ -n "${PR_NUMBER:-}" ]]; then
            {
              echo '## 多资料定向测试失败'
              echo
              echo '```text'
              tail -n 200 "$RUNNER_TEMP/material-tests.log"
              echo '```'
            } > "$RUNNER_TEMP/material-tests-comment.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/material-tests-comment.md"
          fi
          exit "$status"

      - name: Run full automated suite
        working-directory: outputs/kaoyan-schedule-app
        shell: bash
        env:
          CAOBIJI_GITHUB_TOKEN: ''
        run: |
          mapfile -d '' test_files < <(find cloudflare scripts -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0 | sort -z)
          (( ${#test_files[@]} > 0 ))
          node --test "${test_files[@]}"

      - name: Build application
        working-directory: outputs/kaoyan-schedule-app
        run: npm run build

      - name: Commit verified generated source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            outputs/kaoyan-schedule-app/cloudflare/media.js \
            outputs/kaoyan-schedule-app/cloudflare/github-store.js \
            outputs/kaoyan-schedule-app/cloudflare/worker.js \
            outputs/kaoyan-schedule-app/cloudflare/media-material.test.mjs \
            outputs/kaoyan-schedule-app/src/utils/notes.ts \
            outputs/kaoyan-schedule-app/src/components/QuickMaterialComposer.tsx \
            outputs/kaoyan-schedule-app/src/components/NoteDropApp.tsx \
            outputs/kaoyan-schedule-app/src/components/LearningCenter.tsx \
            outputs/kaoyan-schedule-app/src/quick-material-composer.css \
            outputs/kaoyan-schedule-app/src/learning-center.css
          if git diff --cached --quiet; then
            echo 'No generated source changes remain.'
            exit 0
          fi
          git commit -m 'feat: add text and multimaterial learning capture'
          git push origin HEAD:fix/learning-record-multimaterial-continuation
