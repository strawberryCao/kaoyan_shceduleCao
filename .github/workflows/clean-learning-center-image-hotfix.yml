name: Clean learning center image hotfix

on:
  pull_request:
    branches: [fix/learning-detail-title-latex]
    types: [synchronize]

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'fix/learning-center-image-display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/learning-center-image-display
          fetch-depth: 0
      - name: Restore baseline command files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/learning-detail-title-latex
          files=(
            outputs/kaoyan-schedule-app/取消开机自启.cmd
            outputs/kaoyan-schedule-app/安装依赖.cmd
            outputs/kaoyan-schedule-app/导入敦煌壁纸图片.cmd
            outputs/kaoyan-schedule-app/收集环境信息.cmd
            outputs/kaoyan-schedule-app/整理笔记元数据.cmd
            outputs/kaoyan-schedule-app/测试千问连接.cmd
            outputs/kaoyan-schedule-app/生成敦煌动态壁纸视频.cmd
            outputs/kaoyan-schedule-app/设置开机自启.cmd
            outputs/kaoyan-schedule-app/配置千问命名.cmd
          )
          for file in "${files[@]}"; do
            blob=$(git rev-parse "origin/fix/learning-detail-title-latex:$file")
            mode=$(git ls-tree origin/fix/learning-detail-title-latex -- "$file" | awk '{print $1}')
            git update-index --cacheinfo "$mode,$blob,$file"
          done
          rm -f .github/workflows/clean-learning-center-image-hotfix.yml
          git add -A
          git commit -m "chore: remove unrelated command file noise"
          git push origin HEAD:fix/learning-center-image-display
